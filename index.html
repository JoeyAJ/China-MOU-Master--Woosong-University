<style>
:root{--bg:#f7f5ef;--surface:#fff;--surface2:#f1eee7;--ink:#171512;--muted:#7b7468;--line:#dfd8ce;--accent:#b45309;--accent2:#0f766e;--blue:#2563eb;--red:#dc2626;--yellow:#ca8a04;--green:#16a34a;--cyan:#0891b2;--purple:#7c3aed;--shadow:0 14px 40px rgba(35,31,25,.08)}
*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--ink);font-family:'Inter','Noto Sans SC','Noto Sans KR',system-ui,-apple-system,BlinkMacSystemFont,sans-serif;font-size:14px;min-height:100vh}.header{background:linear-gradient(135deg,#fff 0%,#f4efe4 72%,#efe2d0 100%);border-bottom:1px solid var(--line);padding:34px 42px 26px;display:flex;justify-content:space-between;align-items:flex-end;gap:22px;flex-wrap:wrap}.eyebrow{color:var(--accent2);text-transform:uppercase;letter-spacing:.12em;font-size:11px;font-weight:800;display:flex;gap:8px;align-items:center;margin-bottom:8px}.dot{width:8px;height:8px;border-radius:999px;background:var(--accent2);box-shadow:0 0 0 6px rgba(15,118,110,.12)}h1{font-size:34px;letter-spacing:-.04em;font-weight:900;line-height:1.05;margin-bottom:7px}.header p{color:var(--muted);font-size:13px;line-height:1.65;max-width:920px}.header-right{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;align-items:stretch}.lang-toggle{display:flex;gap:6px;align-self:flex-start;background:rgba(255,255,255,.68);border:1px solid rgba(223,216,206,.9);border-radius:999px;padding:5px;box-shadow:0 8px 22px rgba(31,26,19,.05)}.lang-toggle button{border:none;border-radius:999px;background:transparent;color:var(--muted);font-weight:800;font-size:12px;padding:7px 12px;cursor:pointer}.lang-toggle button.active{background:var(--ink);color:#fff}.hero-kpi{min-width:142px;background:rgba(255,255,255,.72);border:1px solid rgba(223,216,206,.9);border-radius:16px;padding:13px 16px;box-shadow:0 10px 26px rgba(31,26,19,.05)}.hero-kpi .label{font-size:10px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.09em;margin-bottom:5px}.hero-kpi .value{font-size:30px;font-weight:900;letter-spacing:-.05em}.nav{display:flex;gap:0;border-bottom:1px solid var(--line);background:rgba(255,255,255,.82);position:sticky;top:0;z-index:20;padding:0 34px;overflow-x:auto;backdrop-filter:blur(12px)}.nav button{border:none;background:transparent;padding:15px 18px;cursor:pointer;color:var(--muted);font-weight:800;border-bottom:3px solid transparent;white-space:nowrap}.nav button:hover{color:var(--ink)}.nav button.active{color:var(--ink);border-bottom-color:var(--ink)}.main{padding:24px 42px 36px}.page{display:none}.page.active{display:block}.filter-panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:20px;box-shadow:var(--shadow)}.filters{display:grid;grid-template-columns:1.5fr repeat(5,1fr) auto;gap:10px;align-items:end}.fg{display:flex;flex-direction:column;gap:6px}.fg label{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:900}.fg input,.fg select{height:38px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);padding:0 11px;font:inherit;font-size:13px;outline:none}.fg input:focus,.fg select:focus{border-color:var(--accent2);box-shadow:0 0 0 3px rgba(15,118,110,.08)}.btn{height:38px;border:none;border-radius:10px;background:var(--ink);color:#fff;padding:0 14px;font-weight:900;cursor:pointer;white-space:nowrap}.btn.secondary{background:#fff;color:var(--muted);border:1px solid var(--line)}.btn.secondary:hover{color:var(--ink);background:var(--surface2)}.note{background:#fff8eb;border:1px solid #fed7aa;color:#7c2d12;border-radius:16px;padding:13px 16px;font-size:13px;line-height:1.65;margin-bottom:18px}.grid-kpi{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:18px}.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow)}.kpi .k-label{font-size:11px;color:var(--muted);font-weight:900;letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px}.kpi .k-value{font-size:34px;font-weight:900;letter-spacing:-.05em}.kpi .k-sub{color:var(--muted);font-size:12px;margin-top:6px;line-height:1.45}.chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:18px}.section-title{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}.section-title h2{font-size:16px;font-weight:900;letter-spacing:-.02em}.section-title .sub{font-size:12px;color:var(--muted)}.chart-box{height:340px;position:relative}.region-layout{display:grid;grid-template-columns:250px 1fr;gap:18px}.side-list{display:flex;flex-direction:column;gap:7px}.region-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;font-weight:900;transition:.12s}.region-card:hover{background:var(--surface2)}.region-card.active{background:var(--ink);color:#fff;border-color:var(--ink)}.region-card small{color:var(--muted);font-weight:900}.region-card.active small{color:rgba(255,255,255,.7)}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:14px;background:#fff}table{width:100%;border-collapse:collapse;font-size:13px}th{background:var(--surface2);color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.08em;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}tr:last-child td{border-bottom:none}tr:hover td{background:#faf8f3}.pill{display:inline-flex;align-items:center;border-radius:999px;padding:3px 9px;font-size:11px;font-weight:900;white-space:nowrap}.pill.region{background:#eef2ff;color:#3730a3}.pill.type{background:#ecfdf5;color:#065f46}.pill.status-有效{background:#dcfce7;color:#166534}.pill.status-长期有效{background:#cffafe;color:#155e75}.pill.status-12个月内到期{background:#fef3c7;color:#92400e}.pill.status-已过期{background:#fee2e2;color:#991b1b}.pill.status-未标注到期日{background:#f3f4f6;color:#4b5563}.pill.status-需人工确认{background:#fae8ff;color:#86198f}.meta-row{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:13px;margin:8px 0 12px;flex-wrap:wrap}.comp-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.comp-item{border:1px solid var(--line);border-radius:14px;padding:12px;background:#fff}.comp-head{display:flex;justify-content:space-between;font-weight:900;font-size:12px;margin-bottom:8px;gap:8px}.comp-bar{height:8px;background:var(--surface2);border-radius:999px;overflow:hidden}.comp-fill{height:100%;background:linear-gradient(90deg,var(--accent2),var(--blue));border-radius:999px}.footer-note{color:var(--muted);font-size:12px;line-height:1.55;margin-top:14px}.export-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;margin-bottom:12px}@media(max-width:1150px){.grid-kpi{grid-template-columns:repeat(3,1fr)}.chart-grid,.region-layout{grid-template-columns:1fr}.filters{grid-template-columns:1fr 1fr}}@media(max-width:700px){.header,.main{padding-left:18px;padding-right:18px}.grid-kpi,.comp-grid,.filters{grid-template-columns:1fr}h1{font-size:28px}}@media print{.nav,.filter-panel,.export-row,.lang-toggle{display:none}body{background:#fff}.main{padding:10px}.card{box-shadow:none}}
.pill.status-Ongoing{background:#dcfce7;color:#166534}.pill.status-Expired{background:#fee2e2;color:#991b1b}.pill.status-未填写{background:#f3f4f6;color:#4b5563}
</style>

<body>

<nav class="nav"><button class="active" data-page="overview" data-i18n="navOverview"></button><button data-page="region" data-i18n="navRegion"></button><button data-page="timeline" data-i18n="navTimeline"></button><button data-page="data" data-i18n="navData"></button><button data-page="quality" data-i18n="navQuality"></button></nav>
<main class="main"><section class="filter-panel"><div class="filters"><div class="fg"><label data-i18n="filterSearch"></label><input id="searchInput" data-i18n-placeholder="searchPlaceholder" /></div><div class="fg"><label data-i18n="filterRegion"></label><select id="regionFilter"></select></div><div class="fg"><label data-i18n="filterProvince"></label><select id="provinceFilter"></select></div><div class="fg"><label data-i18n="filterType"></label><select id="typeFilter"></select></div><div class="fg"><label data-i18n="filterStatus"></label><select id="statusFilter"></select></div><div class="fg"><label data-i18n="filterYear"></label><select id="yearFilter"></select></div><button class="btn secondary" id="clearBtn" data-i18n="clearBtn"></button></div></section>
<section id="overview" class="page active"><div class="note" data-i18n="overviewNote"></div><div class="grid-kpi"><div class="card kpi"><div class="k-label" data-i18n="kTotal"></div><div class="k-value" id="kTotal">—</div><div class="k-sub" data-i18n="kTotalSub"></div></div><div class="card kpi"><div class="k-label" data-i18n="kUnique"></div><div class="k-value" id="kUnique">—</div><div class="k-sub" data-i18n="kUniqueSub"></div></div><div class="card kpi"><div class="k-label" data-i18n="kRegions"></div><div class="k-value" id="kRegions">—</div><div class="k-sub" data-i18n="kRegionsSub"></div></div><div class="card kpi"><div class="k-label" data-i18n="kProvinces"></div><div class="k-value" id="kProvinces">—</div><div class="k-sub" data-i18n="kProvincesSub"></div></div><div class="card kpi"><div class="k-label" data-i18n="kActive"></div><div class="k-value" id="kActive">—</div><div class="k-sub" data-i18n="kActiveSub"></div></div><div class="card kpi"><div class="k-label" data-i18n="kExpiring"></div><div class="k-value" id="kExpiring">—</div><div class="k-sub" data-i18n="kExpiringSub"></div></div></div><div class="chart-grid"><div class="card"><div class="section-title"><h2 data-i18n="chartRegionTitle"></h2><span class="sub" data-i18n="chartRegionSub"></span></div><div class="chart-box"><canvas id="regionChart"></canvas></div></div><div class="card"><div class="section-title"><h2 data-i18n="chartStatusTitle"></h2><span class="sub" data-i18n="chartStatusSub"></span></div><div class="chart-box"><canvas id="statusChart"></canvas></div></div></div><div class="chart-grid"><div class="card"><div class="section-title"><h2 data-i18n="chartProvinceTitle"></h2><span class="sub" data-i18n="chartProvinceSub"></span></div><div class="chart-box"><canvas id="provinceChart"></canvas></div></div><div class="card"><div class="section-title"><h2 data-i18n="chartTypeTitle"></h2><span class="sub" data-i18n="chartTypeSub"></span></div><div class="chart-box"><canvas id="typeChart"></canvas></div></div></div></section>
<section id="region" class="page"><div class="section-title"><h2 data-i18n="regionMatrixTitle"></h2><span class="sub" data-i18n="regionMatrixSub"></span></div><div class="region-layout"><div class="side-list" id="regionCards"></div><div class="card"><div class="section-title"><h2 id="regionTitle"></h2><span class="sub" id="regionMeta">—</span></div><div class="table-wrap"><table id="provinceSummaryTable"></table></div></div></div></section>
<section id="timeline" class="page"><div class="chart-grid"><div class="card"><div class="section-title"><h2 data-i18n="timelineTitle"></h2><span class="sub" data-i18n="timelineSub"></span></div><div class="chart-box"><canvas id="timelineChart"></canvas></div></div><div class="card"><div class="section-title"><h2 data-i18n="recentTitle"></h2><span class="sub" data-i18n="recentSub"></span></div><div class="table-wrap"><table id="recentTable"></table></div></div></div><div class="card"><div class="section-title"><h2 data-i18n="expiryTitle"></h2><span class="sub" data-i18n="expirySub"></span></div><div class="table-wrap"><table id="expiryTable"></table></div></div></section>
<section id="data" class="page"><div class="export-row"><button class="btn secondary" onclick="downloadCSV()" data-i18n="downloadCsv"></button><button class="btn secondary" onclick="window.print()" data-i18n="printPdf"></button></div><div class="meta-row"><span id="dataMeta">—</span><span data-i18n="dataLimit"></span></div><div class="table-wrap"><table id="detailTable"></table></div></section>
<section id="quality" class="page"><div class="section-title"><h2 data-i18n="qualityTitle"></h2><span class="sub" data-i18n="qualitySub"></span></div><div class="card" style="margin-bottom:18px"><div class="comp-grid" id="completenessGrid"></div><p class="footer-note" data-i18n="qualityNote"></p></div><div class="chart-grid"><div class="card"><div class="section-title"><h2 data-i18n="completeTitle"></h2><span class="sub" data-i18n="completeSub"></span></div><div class="chart-box"><canvas id="completeChart"></canvas></div></div><div class="card"><div class="section-title"><h2 data-i18n="duplicateTitle"></h2><span class="sub" data-i18n="duplicateSub"></span></div><div class="table-wrap"><table id="duplicateTable"></table></div></div></div></section><p class="footer-note" data-i18n="footer"></p></main>
<script>
let RAW = [];
let BASE_SUMMARY = {total:0,uniquePartners:0,regions:0,provinces:0,campusFilled:0,signedFilled:0,endFilled:0,mouTypeFilled:0,programModelFilled:0,directionFilled:0,counterpartyFilled:0,activeKnown:0,expired:0,minYear:null,maxYear:null,statusCounts:{},mouTypeCounts:{},programModelCounts:{},counterpartyCounts:{},regionCounts:{},provinceCounts:{}};
const EXCEL_PATHS = [
  'China_MOU_Master.xlsx'
];
const EXCEL_SHEET_NAME = 'China_MOU_Master';
function normalizeCellValue(v){return String(v??'').trim()}
function pick(row, names){for(const name of names){if(Object.prototype.hasOwnProperty.call(row,name)){return normalizeCellValue(row[name])}}return ''}
function parseSignedYear(v){const m=String(v??'').match(/(19|20)\d{2}/);return m?Number(m[0]):null}
function parseCounterpartyGroup(v){const s=normalizeCellValue(v);if(!s)return '';return s.split('/')[0].split('；')[0].split(';')[0].trim()}
function excelRowToRecord(row, index){
  const signedRaw=pick(row,['Signed Year','签署年','签署日','Signed Date']);
  const status=pick(row,['Status','状态']) || 'Expired';
  const counterpartyType=pick(row,['Counterparty Type','合作对象类型']);
  return {
    no: pick(row,['No.','No','NO','序号']) || String(index+1),
    chineseName: pick(row,['Chinese Name','中文名称','ChineseName']),
    koreanName: pick(row,['Korea Name','Korean Name','韩文名称','KoreaName']),
    province: pick(row,['Province / Area','Province/Area','Province','省份/地区','省份']),
    region: pick(row,['China Region','Region','中国区域','区域']),
    campus: pick(row,['Campus','校区']),
    mouType: pick(row,['MOU Type','MOU类型']) || '未填写',
    programModel: pick(row,['Program Model','项目模式']) || 'Other',
    direction: pick(row,['Direction','方向']) || 'Reciprocal',
    signedRaw,
    signedYear: parseSignedYear(signedRaw),
    endRaw: pick(row,['End Year','End Date','有效期至','结束年']),
    status,
    inferredStatus: status,
    counterpartyType,
    counterpartyGroup: parseCounterpartyGroup(counterpartyType),
    notes: pick(row,['Notes','备注','备注栏位'])
  }
}
function summarizeRows(rows){
  const uniqueValues=(arr)=>[...new Set(arr.filter(v=>v!==undefined&&v!==null&&String(v).trim()!==''))];
  const countMap=(arr)=>arr.reduce((m,v)=>{const key=String(v||'未填写');m[key]=(m[key]||0)+1;return m},{});
  const years=rows.map(r=>r.signedYear).filter(y=>Number.isFinite(y));
  return {
    total: rows.length,
    uniquePartners: uniqueValues(rows.map(r=>r.chineseName)).length,
    regions: uniqueValues(rows.map(r=>r.region)).length,
    provinces: uniqueValues(rows.map(r=>r.province)).length,
    campusFilled: rows.filter(r=>r.campus).length,
    signedFilled: rows.filter(r=>r.signedRaw).length,
    endFilled: rows.filter(r=>r.endRaw).length,
    mouTypeFilled: rows.filter(r=>r.mouType).length,
    programModelFilled: rows.filter(r=>r.programModel).length,
    directionFilled: rows.filter(r=>r.direction).length,
    counterpartyFilled: rows.filter(r=>r.counterpartyType).length,
    activeKnown: rows.filter(r=>r.status==='Ongoing').length,
    expired: rows.filter(r=>r.status==='Expired').length,
    minYear: years.length?Math.min(...years):null,
    maxYear: years.length?Math.max(...years):null,
    statusCounts: countMap(rows.map(r=>r.status)),
    mouTypeCounts: countMap(rows.map(r=>r.mouType)),
    programModelCounts: countMap(rows.map(r=>r.programModel)),
    counterpartyCounts: countMap(rows.map(r=>r.counterpartyType)),
    regionCounts: countMap(rows.map(r=>r.region)),
    provinceCounts: countMap(rows.map(r=>r.province))
  }
}
async function fetchExcelArrayBuffer(){
  const errors=[];
  for(const path of EXCEL_PATHS){
    try{
      const url=path+(path.includes('?')?'&':'?')+'v='+Date.now();
      const res=await fetch(url,{cache:'no-store'});
      if(!res.ok){throw new Error(path+' HTTP '+res.status)}
      return {buffer:await res.arrayBuffer(),path};
    }catch(err){errors.push(err.message)}
  }
  throw new Error(errors.join(' / '));
}
async function loadExcelData(){
  if(typeof XLSX==='undefined') throw new Error('SheetJS XLSX library failed to load.');
  const {buffer,path}=await fetchExcelArrayBuffer();
  const workbook=XLSX.read(buffer,{type:'array',cellDates:true});
  const sheetName=workbook.SheetNames.includes(EXCEL_SHEET_NAME)?EXCEL_SHEET_NAME:(workbook.SheetNames[1]||workbook.SheetNames[0]);
  const worksheet=workbook.Sheets[sheetName];
  const rows=XLSX.utils.sheet_to_json(worksheet,{defval:'',raw:false});
  RAW=rows.map(excelRowToRecord).filter(r=>r.chineseName||r.koreanName);
  BASE_SUMMARY=summarizeRows(RAW);
  console.info('China MOU Dashboard loaded Excel:', path, sheetName, RAW.length);
}
function showLoadError(err){
  const note=document.querySelector('.note');
  if(note){note.innerHTML='无法读取 GitHub 中的 Excel 数据。请确认 Excel 文件已和 <strong>index.html</strong> 放在同一层，并且文件名为 <strong>China_MOU_Master.xlsx</strong>，然后刷新页面。<br><span style="font-size:12px;color:#991b1b">'+safe(err.message)+'</span>';note.style.borderColor='#fecaca';note.style.background='#fff1f2';note.style.color='#991b1b'}
  console.error(err);
}

function t(k){return (UI[LANG]&&UI[LANG][k])||UI.zh[k]||k}
function val(x){return LANG==='ko'?(VAL_KO[String(x)]||String(x)):String(x)}
function fmt(n){return Number(n||0).toLocaleString(LANG==='ko'?'ko-KR':'zh-CN')}
function uniq(a){return[...new Set(a.filter(v=>v!==undefined&&v!==null&&String(v).trim()!==''))]}
function countBy(rows,key){const m=new Map();rows.forEach(r=>{const v=r[key]||(LANG==='ko'?'미기재':'未填写');m.set(v,(m.get(v)||0)+1)});return[...m.entries()].sort((a,b)=>b[1]-a[1])}
function safe(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function statusClass(s){return 'pill status-'+String(s||'').replace(/[^A-Za-z0-9_\-一-龥가-힣]/g,'')}
function interpolate(str,vars){return String(str).replace(/\{\{(.*?)\}\}/g,(_,k)=>vars[k.trim()]??'')}
function displayName(r){return LANG==='ko'?(r.koreanName||r.chineseName):r.chineseName}

function applyStaticText(){document.querySelectorAll('[data-i18n]').forEach(el=>{el.innerHTML=t(el.dataset.i18n)});document.querySelectorAll('[data-i18n-placeholder]').forEach(el=>{el.placeholder=t(el.dataset.i18nPlaceholder)});const label=document.querySelector('[data-i18n="kExpiring"]');if(label)label.innerHTML=t('kExpired');const sub=document.querySelector('[data-i18n="kExpiringSub"]');if(sub)sub.innerHTML=t('kExpiredSub')}
function fillSelect(id,values){const sel=document.getElementById(id);sel.innerHTML='';const all=document.createElement('option');all.value='';all.textContent=t('all');sel.appendChild(all);values.forEach(v=>{const opt=document.createElement('option');opt.value=v;opt.textContent=id==='yearFilter'?v:val(v);sel.appendChild(opt)})}
function populateFilters(){const saved={regionFilter:regionFilter.value,provinceFilter:provinceFilter.value,typeFilter:typeFilter.value,statusFilter:statusFilter.value,yearFilter:yearFilter.value};fillSelect('regionFilter',uniq(RAW.map(r=>r.region)).sort());fillSelect('provinceFilter',uniq(RAW.map(r=>r.province)).sort());fillSelect('typeFilter',uniq(RAW.map(r=>r.mouType)).sort());fillSelect('statusFilter',STATUS_ORDER.filter(s=>RAW.some(r=>r.status===s)));fillSelect('yearFilter',uniq(RAW.map(r=>r.signedYear)).sort((a,b)=>b-a));Object.entries(saved).forEach(([id,v])=>{if([...document.getElementById(id).options].some(o=>String(o.value)===String(v)))document.getElementById(id).value=v})}
function initFilters(){populateFilters();['searchInput','regionFilter','provinceFilter','typeFilter','statusFilter','yearFilter'].forEach(id=>document.getElementById(id).addEventListener('input',()=>{selectedRegion='';updateAll()}));clearBtn.addEventListener('click',()=>{['searchInput','regionFilter','provinceFilter','typeFilter','statusFilter','yearFilter'].forEach(id=>document.getElementById(id).value='');selectedRegion='';updateAll()});langZh.addEventListener('click',()=>setLang('zh'));langKo.addEventListener('click',()=>setLang('ko'))}

function filteredRows(){const q=searchInput.value.trim().toLowerCase(),rf=regionFilter.value,pf=provinceFilter.value,tf=typeFilter.value,sf=statusFilter.value,yf=yearFilter.value;return RAW.filter(r=>{const hay=[r.chineseName,r.koreanName,r.province,r.region,r.mouType,r.programModel,r.direction,r.status,r.counterpartyType,r.counterpartyGroup,r.notes,val(r.province),val(r.region),val(r.status),val(r.counterpartyType)].join(' ').toLowerCase();if(q&&!hay.includes(q))return false;if(rf&&r.region!==rf)return false;if(pf&&r.province!==pf)return false;if(tf&&r.mouType!==tf)return false;if(sf&&r.status!==sf)return false;if(yf&&String(r.signedYear)!==String(yf))return false;return true})}
function setKpis(rows){const unique=uniq(rows.map(r=>r.chineseName)).length,regions=uniq(rows.map(r=>r.region)).length,provinces=uniq(rows.map(r=>r.province)).length,active=rows.filter(r=>r.status==='Ongoing').length,expired=rows.filter(r=>r.status==='Expired').length;heroTotal.textContent=fmt(BASE_SUMMARY.total);heroUnique.textContent=fmt(BASE_SUMMARY.uniquePartners);heroActive.textContent=fmt(BASE_SUMMARY.activeKnown);kTotal.textContent=fmt(rows.length);kUnique.textContent=fmt(unique);kRegions.textContent=fmt(regions);kProvinces.textContent=fmt(provinces);kActive.textContent=fmt(active);kExpiring.textContent=fmt(expired)}
function renderChart(id,type,labels,data,opts={}){const ctx=document.getElementById(id);if(!ctx)return;if(charts[id])charts[id].destroy();charts[id]=new Chart(ctx,{type,data:{labels:labels.map(x=>val(x)),datasets:[{label:opts.label||t('recordsLabel'),data,backgroundColor:opts.colors||COLORS,borderColor:opts.borderColor||COLORS[0],borderWidth:opts.borderWidth??1.5,tension:.32,fill:opts.fill??false}]},options:{responsive:true,maintainAspectRatio:false,indexAxis:opts.indexAxis||'x',plugins:{legend:{display:opts.legend??(type==='doughnut'||type==='pie'),position:'bottom',labels:{boxWidth:10,usePointStyle:true}},tooltip:{callbacks:{label:ctx=>`${ctx.label}: ${fmt(ctx.raw)}`}}},scales:opts.scales===false?{}:{x:{ticks:{color:'#7b7468'},grid:{color:'rgba(223,216,206,.55)'}},y:{ticks:{color:'#7b7468'},grid:{color:'rgba(223,216,206,.55)'}}}}})}
function drawOverview(rows){const rc=countBy(rows,'region');renderChart('regionChart','bar',rc.map(x=>x[0]),rc.map(x=>x[1]),{indexAxis:'y',legend:false,label:t('recordsLabel')});const sc=STATUS_ORDER.map(s=>[s,rows.filter(r=>r.status===s).length]).filter(x=>x[1]>0);renderChart('statusChart','doughnut',sc.map(x=>x[0]),sc.map(x=>x[1]),{scales:false});const pc=countBy(rows,'province').slice(0,15);renderChart('provinceChart','bar',pc.map(x=>x[0]),pc.map(x=>x[1]),{indexAxis:'y',legend:false,label:t('recordsLabel')});const tc=countBy(rows,'mouType');renderChart('typeChart','doughnut',tc.map(x=>x[0]),tc.map(x=>x[1]),{scales:false})}
function makeTable(el,headers,rows,empty){const table=document.getElementById(el);if(!rows.length){table.innerHTML=`<tr><td style="padding:28px;text-align:center;color:#7b7468">${empty||t('noData')}</td></tr>`;return}table.innerHTML=`<thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody>`}
function drawRegion(rows){const regions=countBy(rows,'region'),holder=regionCards;holder.innerHTML=`<div class="region-card ${selectedRegion===''?'active':''}" onclick="selectedRegion=''; drawRegion(currentRows)"><span>${t('allRegions')}</span><small>${fmt(rows.length)}</small></div>`+regions.map(([rg,n])=>`<div class="region-card ${selectedRegion===rg?'active':''}" onclick="selectedRegion='${safe(rg)}'; drawRegion(currentRows)"><span>${safe(val(rg))}</span><small>${fmt(n)}</small></div>`).join('');const scoped=selectedRegion?rows.filter(r=>r.region===selectedRegion):rows;regionTitle.textContent=selectedRegion?val(selectedRegion):t('allRegions');regionMeta.textContent=interpolate(t('regionMeta'),{n:fmt(scoped.length),u:fmt(uniq(scoped.map(r=>r.chineseName)).length)});const byProvince=countBy(scoped,'province').map(([p,n])=>{const prs=scoped.filter(r=>r.province===p),typeMap=Object.fromEntries(countBy(prs,'counterpartyGroup'));return`<tr><td><span class="pill region">${safe(val(p))}</span></td><td>${fmt(n)}</td><td>${fmt(uniq(prs.map(r=>r.chineseName)).length)}</td><td>${fmt(typeMap['本科院校']||0)}</td><td>${fmt(typeMap['专科院校']||0)}</td><td>${fmt(typeMap['高中']||0)}</td><td>${fmt(typeMap['机构']||0)}</td><td>${fmt(Object.entries(typeMap).filter(([k])=>!['本科院校','专科院校','高中','机构'].includes(k)).reduce((s,kv)=>s+kv[1],0))}</td></tr>`});makeTable('provinceSummaryTable',t('thProvince'),byProvince)}
function drawTimeline(rows){const years=uniq(rows.map(r=>r.signedYear)).sort((a,b)=>a-b),counts=years.map(y=>rows.filter(r=>r.signedYear===y).length);renderChart('timelineChart','line',years,counts,{legend:false,label:t('signedRecord'),borderColor:'#0f766e',colors:['rgba(15,118,110,.18)'],fill:true});const recent=rows.filter(r=>r.signedYear).sort((a,b)=>(b.signedYear||0)-(a.signedYear||0)).slice(0,16).map(r=>`<tr><td>${safe(r.signedRaw)}</td><td>${safe(displayName(r))}</td><td>${safe(val(r.province))}</td><td><span class="pill type">${safe(val(r.mouType))}</span></td><td>${safe(r.programModel)}</td><td><span class="${statusClass(r.status)}">${safe(val(r.status))}</span></td></tr>`);makeTable('recentTable',t('thRecent'),recent);const exp=rows.filter(r=>r.status==='Expired').sort((a,b)=>(b.signedYear||0)-(a.signedYear||0)).slice(0,220).map(r=>`<tr><td><span class="${statusClass(r.status)}">${safe(val(r.status))}</span></td><td>${safe(r.endRaw)}</td><td>${safe(displayName(r))}</td><td>${safe(val(r.province))}</td><td>${safe(val(r.mouType))}</td><td>${safe(r.programModel)}</td></tr>`);makeTable('expiryTable',t('thExpiry'),exp,t('noExpiry'))}
function drawDetails(rows){dataMeta.textContent=interpolate(t('dataMeta'),{n:fmt(rows.length),total:fmt(RAW.length)});const shown=rows.slice(0,300).map(r=>`<tr><td>${safe(r.no)}</td><td><strong>${safe(displayName(r))}</strong><br><span style="color:#7b7468">${safe(subName(r))}</span></td><td><span class="pill region">${safe(val(r.region))}</span><br>${safe(val(r.province))}</td><td>${safe(r.campus)}</td><td><span class="pill type">${safe(val(r.mouType))}</span></td><td>${safe(r.programModel)}</td><td>${safe(val(r.counterpartyType))}</td><td>${safe(r.signedRaw)}<br><span style="color:#7b7468">${safe(r.endRaw)}</span></td><td><span class="${statusClass(r.status)}">${safe(val(r.status))}</span></td><td>${safe(r.notes)}</td></tr>`);makeTable('detailTable',t('thDetail'),shown)}
function drawQuality(){const rawFields=[['province',RAW.filter(r=>r.province).length],['region',RAW.filter(r=>r.region).length],['campus',RAW.filter(r=>r.campus).length],['mouType',RAW.filter(r=>r.mouType&&r.mouType!=='未填写').length],['programModel',RAW.filter(r=>r.programModel&&r.programModel!=='Other').length],['direction',RAW.filter(r=>r.direction).length],['signedRaw',RAW.filter(r=>r.signedRaw).length],['endRaw',RAW.filter(r=>r.endRaw).length],['status',RAW.filter(r=>r.status).length],['counterpartyType',RAW.filter(r=>r.counterpartyType).length],['notes',RAW.filter(r=>r.notes).length]],fields=rawFields.map((x,i)=>[t('fields')[i],x[0],x[1]]);completenessGrid.innerHTML=fields.map(([label,key,n])=>{const pct=Math.round(n/RAW.length*100);return`<div class="comp-item"><div class="comp-head"><span>${safe(label)}</span><span>${pct}%</span></div><div class="comp-bar"><div class="comp-fill" style="width:${pct}%"></div></div><div class="footer-note" style="margin-top:6px">${fmt(n)} / ${fmt(RAW.length)}</div></div>`}).join('');renderChart('completeChart','bar',fields.map(x=>x[0]),fields.map(x=>Math.round(x[2]/RAW.length*100)),{indexAxis:'y',legend:false,label:t('completionRate')});if(charts.completeChart){charts.completeChart.options.plugins.tooltip.callbacks.label=ctx=>`${ctx.label}: ${ctx.raw}%`;charts.completeChart.update()}const nameMap=new Map();RAW.forEach(r=>{if(!r.chineseName)return;if(!nameMap.has(r.chineseName))nameMap.set(r.chineseName,[]);nameMap.get(r.chineseName).push(r)});const dups=[...nameMap.entries()].filter(([name,arr])=>arr.length>1).sort((a,b)=>b[1].length-a[1].length).slice(0,30).map(([name,arr])=>`<tr><td><strong>${safe(LANG==='ko'?(arr[0].koreanName||name):name)}</strong></td><td>${fmt(arr.length)}</td><td>${safe(uniq(arr.map(r=>val(r.province))).join(' / '))}</td><td>${safe(uniq(arr.map(r=>r.mouType)).join(', '))}</td><td>${safe(uniq(arr.map(r=>r.signedRaw).filter(Boolean)).slice(0,8).join(', '))}</td></tr>`);makeTable('duplicateTable',t('thDup'),dups)}
function updateAll(){currentRows=filteredRows();setKpis(currentRows);drawOverview(currentRows);drawRegion(currentRows);drawTimeline(currentRows);drawDetails(currentRows);drawQuality()}
function downloadCSV(){const headers=LANG==='ko'?['No','중문명','한국어명','성/지역','중국 권역','Campus','MOU Type','Program Model','Direction','Signed Year','End Year','Status','Counterparty Type','Notes']:['No','中文名称','韩文名称','省份/地区','中国区域','Campus','MOU Type','Program Model','Direction','Signed Year','End Year','Status','Counterparty Type','Notes'];const rows=currentRows.map(r=>[r.no,r.chineseName,r.koreanName,LANG==='ko'?val(r.province):r.province,LANG==='ko'?val(r.region):r.region,r.campus,LANG==='ko'?val(r.mouType):r.mouType,r.programModel,LANG==='ko'?val(r.direction):r.direction,r.signedRaw,r.endRaw,LANG==='ko'?val(r.status):r.status,LANG==='ko'?val(r.counterpartyType):r.counterpartyType,r.notes]);const csv=[headers,...rows].map(row=>row.map(v=>`"${String(v??'').replaceAll('"','""')}"`).join(',')).join('\n');const blob=new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8;'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=LANG==='ko'?'china_mou_filtered_ko.csv':'china_mou_filtered_zh.csv';a.click();URL.revokeObjectURL(url)}
document.querySelectorAll('.nav button').forEach(btn=>{btn.addEventListener('click',()=>{document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));btn.classList.add('active');document.getElementById(btn.dataset.page).classList.add('active');setTimeout(()=>Object.values(charts).forEach(c=>c.resize()),60)})});
async function bootstrapDashboard(){
  applyStaticText();
  try{
    await loadExcelData();
    initFilters();
    updateAll();
  }catch(err){
    showLoadError(err);
  }
}
bootstrapDashboard();
</script>
</body></html>
