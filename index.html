<!DOCTYPE html>
<html lang="zh-Hans">
<head>

<title>China MOU Dashboard｜Woosong University</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+SC:wght@400;500;700;900&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://apis.google.com/js/api.js"></script>
<style>
:root{--bg:#f7f5ef;--surface:#fff;--surface2:#f1eee7;--ink:#171512;--muted:#7b7468;--line:#dfd8ce;--accent:#b45309;--accent2:#0f766e;--blue:#2563eb;--red:#dc2626;--yellow:#ca8a04;--green:#16a34a;--cyan:#0891b2;--purple:#7c3aed;--shadow:0 14px 40px rgba(35,31,25,.08)}
*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--ink);font-family:'Inter','Noto Sans SC','Noto Sans KR',system-ui,-apple-system,BlinkMacSystemFont,sans-serif;font-size:14px;min-height:100vh}.header{background:linear-gradient(135deg,#fff 0%,#f4efe4 72%,#efe2d0 100%);border-bottom:1px solid var(--line);padding:34px 42px 26px;display:flex;justify-content:space-between;align-items:flex-end;gap:22px;flex-wrap:wrap}.eyebrow{color:var(--accent2);text-transform:uppercase;letter-spacing:.12em;font-size:11px;font-weight:800;display:flex;gap:8px;align-items:center;margin-bottom:8px}.dot{width:8px;height:8px;border-radius:999px;background:var(--accent2);box-shadow:0 0 0 6px rgba(15,118,110,.12)}h1{font-size:34px;letter-spacing:-.04em;font-weight:900;line-height:1.05;margin-bottom:7px}.header p{color:var(--muted);font-size:13px;line-height:1.65;max-width:920px}.header-right{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;align-items:stretch}.lang-toggle{display:flex;gap:6px;align-self:flex-start;background:rgba(255,255,255,.68);border:1px solid rgba(223,216,206,.9);border-radius:999px;padding:5px;box-shadow:0 8px 22px rgba(31,26,19,.05)}.lang-toggle button{border:none;border-radius:999px;background:transparent;color:var(--muted);font-weight:800;font-size:12px;padding:7px 12px;cursor:pointer}.lang-toggle button.active{background:var(--ink);color:#fff}.hero-kpi{min-width:142px;background:rgba(255,255,255,.72);border:1px solid rgba(223,216,206,.9);border-radius:16px;padding:13px 16px;box-shadow:0 10px 26px rgba(31,26,19,.05)}.hero-kpi .label{font-size:10px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.09em;margin-bottom:5px}.hero-kpi .value{font-size:30px;font-weight:900;letter-spacing:-.05em}.nav{display:flex;gap:0;border-bottom:1px solid var(--line);background:rgba(255,255,255,.82);position:sticky;top:0;z-index:20;padding:0 34px;overflow-x:auto;backdrop-filter:blur(12px)}.nav button{border:none;background:transparent;padding:15px 18px;cursor:pointer;color:var(--muted);font-weight:800;border-bottom:3px solid transparent;white-space:nowrap}.nav button:hover{color:var(--ink)}.nav button.active{color:var(--ink);border-bottom-color:var(--ink)}.main{padding:24px 42px 36px}.page{display:none}.page.active{display:block}.filter-panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:20px;box-shadow:var(--shadow)}.filters{display:grid;grid-template-columns:1.5fr repeat(5,1fr) auto;gap:10px;align-items:end}.fg{display:flex;flex-direction:column;gap:6px}.fg label{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:900}.fg input,.fg select{height:38px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);padding:0 11px;font:inherit;font-size:13px;outline:none}.fg input:focus,.fg select:focus{border-color:var(--accent2);box-shadow:0 0 0 3px rgba(15,118,110,.08)}.btn{height:38px;border:none;border-radius:10px;background:var(--ink);color:#fff;padding:0 14px;font-weight:900;cursor:pointer;white-space:nowrap}.btn.secondary{background:#fff;color:var(--muted);border:1px solid var(--line)}.btn.secondary:hover{color:var(--ink);background:var(--surface2)}.note{background:#fff8eb;border:1px solid #fed7aa;color:#7c2d12;border-radius:16px;padding:13px 16px;font-size:13px;line-height:1.65;margin-bottom:18px}.grid-kpi{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:18px}.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow)}.kpi .k-label{font-size:11px;color:var(--muted);font-weight:900;letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px}.kpi .k-value{font-size:34px;font-weight:900;letter-spacing:-.05em}.kpi .k-sub{color:var(--muted);font-size:12px;margin-top:6px;line-height:1.45}.chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:18px}.section-title{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}.section-title h2{font-size:16px;font-weight:900;letter-spacing:-.02em}.section-title .sub{font-size:12px;color:var(--muted)}.chart-box{height:340px;position:relative}.region-layout{display:grid;grid-template-columns:250px 1fr;gap:18px}.side-list{display:flex;flex-direction:column;gap:7px}.region-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;font-weight:900;transition:.12s}.region-card:hover{background:var(--surface2)}.region-card.active{background:var(--ink);color:#fff;border-color:var(--ink)}.region-card small{color:var(--muted);font-weight:900}.region-card.active small{color:rgba(255,255,255,.7)}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:14px;background:#fff}table{width:100%;border-collapse:collapse;font-size:13px}th{background:var(--surface2);color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.08em;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}tr:last-child td{border-bottom:none}tr:hover td{background:#faf8f3}.pill{display:inline-flex;align-items:center;border-radius:999px;padding:3px 9px;font-size:11px;font-weight:900;white-space:nowrap}.pill.region{background:#eef2ff;color:#3730a3}.pill.type{background:#ecfdf5;color:#065f46}.pill.status-有效{background:#dcfce7;color:#166534}.pill.status-长期有效{background:#cffafe;color:#155e75}.pill.status-12个月内到期{background:#fef3c7;color:#92400e}.pill.status-已过期{background:#fee2e2;color:#991b1b}.pill.status-未标注到期日{background:#f3f4f6;color:#4b5563}.pill.status-需人工确认{background:#fae8ff;color:#86198f}.meta-row{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:13px;margin:8px 0 12px;flex-wrap:wrap}.comp-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.comp-item{border:1px solid var(--line);border-radius:14px;padding:12px;background:#fff}.comp-head{display:flex;justify-content:space-between;font-weight:900;font-size:12px;margin-bottom:8px;gap:8px}.comp-bar{height:8px;background:var(--surface2);border-radius:999px;overflow:hidden}.comp-fill{height:100%;background:linear-gradient(90deg,var(--accent2),var(--blue));border-radius:999px}.footer-note{color:var(--muted);font-size:12px;line-height:1.55;margin-top:14px}.export-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;margin-bottom:12px}@media(max-width:1150px){.grid-kpi{grid-template-columns:repeat(3,1fr)}.chart-grid,.region-layout{grid-template-columns:1fr}.filters{grid-template-columns:1fr 1fr}}@media(max-width:700px){.header,.main{padding-left:18px;padding-right:18px}.grid-kpi,.comp-grid,.filters{grid-template-columns:1fr}h1{font-size:28px}}@media print{.nav,.filter-panel,.export-row,.lang-toggle{display:none}body{background:#fff}.main{padding:10px}.card{box-shadow:none}}

.quality-kpi-strip{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:18px}.quality-kpi-item{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 18px;box-shadow:var(--shadow)}.quality-kpi-item .label{font-size:10px;color:var(--muted);font-weight:900;text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}.quality-kpi-item .num{font-size:32px;font-weight:900;letter-spacing:-.05em;line-height:1}.quality-kpi-item .sub{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.4}.quality-vis-grid{display:grid;grid-template-columns:1.35fr .95fr;gap:18px;margin-bottom:18px}.summary-groups{display:flex;flex-direction:column;gap:16px}.summary-group{border:1px solid var(--line);border-radius:14px;padding:14px;background:#fff}.summary-group h3{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:10px;font-weight:900}.summary-chip-list{display:flex;flex-wrap:wrap;gap:8px}.summary-chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 10px;background:#f8fafc;border:1px solid #e5e7eb;font-size:12px;font-weight:900;color:#334155}.summary-chip strong{font-size:13px;color:var(--ink)}.summary-chip.green{background:#ecfdf5;color:#065f46;border-color:#d1fae5}.summary-chip.orange{background:#fff7ed;color:#9a3412;border-color:#fed7aa}.summary-chip.blue{background:#eff6ff;color:#1d4ed8;border-color:#dbeafe}.summary-chip.red{background:#fef2f2;color:#991b1b;border-color:#fecaca}.summary-chip.gray{background:#f3f4f6;color:#4b5563;border-color:#e5e7eb}.summary-chip.purple{background:#faf5ff;color:#6b21a8;border-color:#eadcff}.dist-list{display:flex;flex-direction:column;gap:7px}.dist-row{display:flex;justify-content:space-between;gap:10px;font-size:12px;line-height:1.35}.dist-row span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}.dist-row strong{color:var(--ink)}@media(max-width:1150px){.quality-kpi-strip{grid-template-columns:repeat(3,1fr)}.quality-vis-grid{grid-template-columns:1fr}}@media(max-width:700px){.quality-kpi-strip{grid-template-columns:1fr}}

.pill.status-Ongoing{background:#dcfce7;color:#166534}.pill.status-Expired{background:#fee2e2;color:#991b1b}.pill.status-未填写{background:#f3f4f6;color:#4b5563}

.pill.status-Indefinite{background:#cffafe;color:#155e75}.pill.status-PendingRenewal{background:#fef3c7;color:#92400e}

/* ── PDF Viewer ──────────────────────────────────────────── */
.pdf-btn{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;text-decoration:none;white-space:nowrap;transition:.12s;border:none}
.pdf-btn:hover{background:#dbeafe;color:#1e3a8a}
.pdf-none{color:#d1d5db;font-size:13px;font-weight:400}
#pdfOverlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:9000;align-items:center;justify-content:center;padding:20px}
#pdfOverlay.open{display:flex}
#pdfBox{background:#fff;border-radius:20px;width:min(92vw,1080px);height:min(90vh,860px);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.3)}
#pdfHeader{display:flex;justify-content:space-between;align-items:center;padding:16px 22px;border-bottom:1px solid var(--line);gap:16px;flex-shrink:0}
#pdfTitle{font-size:14px;font-weight:900;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:70%}
.pdf-header-actions{display:flex;gap:8px;flex-shrink:0}
.pdf-action-btn{display:inline-flex;align-items:center;gap:5px;padding:6px 13px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--muted);font-size:12px;font-weight:700;cursor:pointer;text-decoration:none;white-space:nowrap}
.pdf-action-btn:hover{background:var(--surface2);color:var(--ink)}
.pdf-close-btn{width:34px;height:34px;border:none;border-radius:999px;background:var(--surface2);color:var(--ink);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:900}
.pdf-close-btn:hover{background:#e5e7eb}
#pdfFrame{flex:1;border:none;background:#f5f5f5}
#pdfFallback{display:none;flex:1;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--muted);font-size:14px;text-align:center;padding:40px}
#pdfFallback a{color:var(--accent2);font-weight:700;text-decoration:underline}
.pdf-coverage-bar{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted);margin-top:10px}
.pdf-coverage-fill{height:6px;border-radius:999px;background:linear-gradient(90deg,var(--accent2),var(--blue));flex-shrink:0}
.pdf-coverage-track{height:6px;border-radius:999px;background:var(--surface2);width:140px;overflow:hidden}

.dist-card{min-height:178px}.dist-list{display:flex;flex-direction:column;gap:7px;margin-top:8px}.dist-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;font-size:12px}.dist-row span:first-child{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.dist-row strong{font-size:13px}.summary-note{color:var(--muted);font-size:12px;line-height:1.55;margin-top:10px}

/* ── Drive Upload ────────────────────────────────────────── */
.drive-status-btn{height:38px;display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.72);color:var(--muted);font-weight:800;font-size:12px;padding:0 14px;cursor:pointer;white-space:nowrap}
.drive-status-btn .dot{width:7px;height:7px;border-radius:999px;background:#d1d5db;box-shadow:none}
.drive-status-btn.connected .dot{background:#16a34a}
.drive-status-btn:hover{background:var(--surface2);color:var(--ink)}
.upload-cell{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.upload-icon-btn{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.upload-icon-btn:hover{background:var(--surface2);color:var(--ink)}
.local-tag{font-size:10px;color:#7c2d12;background:#fff7ed;border:1px solid #fed7aa;border-radius:999px;padding:2px 7px;font-weight:800;white-space:nowrap}
.local-clear{color:#dc2626;font-size:11px;cursor:pointer;font-weight:800;text-decoration:underline;background:none;border:none;padding:0}
#uploadOverlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:9100;align-items:center;justify-content:center;padding:20px}
#uploadOverlay.open{display:flex}
#uploadBox{background:#fff;border-radius:20px;width:min(92vw,480px);padding:26px;box-shadow:0 30px 80px rgba(0,0,0,.3)}
#uploadBox h3{font-size:16px;font-weight:900;margin-bottom:4px}
#uploadBox .up-sub{font-size:12px;color:var(--muted);margin-bottom:18px;line-height:1.5}
#uploadBox .up-row{margin-bottom:14px;display:flex;flex-direction:column;gap:6px}
#uploadBox input[type=file]{border:1px dashed var(--line);border-radius:10px;padding:14px;font-size:12px;background:var(--surface2)}
#uploadBox label.chk{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);cursor:pointer}
#uploadStatus{font-size:12px;color:var(--muted);min-height:18px;line-height:1.5}
#uploadStatus.error{color:#dc2626}
#uploadStatus.ok{color:#16a34a}
.up-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.up-actions button:disabled{opacity:.55;cursor:not-allowed}
.up-divider{text-align:center;font-size:11px;color:var(--muted);font-weight:800;margin:14px 0}
</style>
</head>
<body>
<header class="header"><div><div class="eyebrow"><span class="dot"></span><span data-i18n="eyebrow"></span></div><h1 data-i18n="title"></h1><p data-i18n="subtitle"></p></div><div class="header-right"><div class="lang-toggle" role="group" aria-label="Language switch"><button id="langZh" class="active" type="button">中文简体</button><button id="langKo" type="button">한국어</button><button id="langEn" type="button">English</button></div><button class="drive-status-btn" id="driveStatusBtn" type="button" onclick="handleDriveStatusClick()"><span class="dot" id="driveStatusDot"></span><span id="driveStatusLabel">连接 Google Drive</span></button><div class="hero-kpi"><div class="label" data-i18n="heroTotalLabel"></div><div class="value" id="heroTotal">—</div></div><div class="hero-kpi"><div class="label" data-i18n="heroUniqueLabel"></div><div class="value" id="heroUnique">—</div></div><div class="hero-kpi"><div class="label" data-i18n="heroActiveLabel"></div><div class="value" id="heroActive">—</div></div></div></header>
<nav class="nav"><button class="active" data-page="overview" data-i18n="navOverview"></button><button data-page="region" data-i18n="navRegion"></button><button data-page="timeline" data-i18n="navTimeline"></button><button data-page="data" data-i18n="navData"></button><button data-page="quality" data-i18n="navQuality"></button></nav>
<main class="main"><section class="filter-panel"><div class="filters"><div class="fg"><label data-i18n="filterSearch"></label><input id="searchInput" data-i18n-placeholder="searchPlaceholder" /></div><div class="fg"><label data-i18n="filterRegion"></label><select id="regionFilter"></select></div><div class="fg"><label data-i18n="filterProvince"></label><select id="provinceFilter"></select></div><div class="fg"><label data-i18n="filterType"></label><select id="typeFilter"></select></div><div class="fg"><label data-i18n="filterStatus"></label><select id="statusFilter"></select></div><div class="fg"><label data-i18n="filterYear"></label><select id="yearFilter"></select></div><button class="btn secondary" id="clearBtn" data-i18n="clearBtn"></button></div></section>
<section id="overview" class="page active"><div class="note" id="loadStatusNote" style="display:none"></div><div class="grid-kpi"><div class="card kpi"><div class="k-label" data-i18n="kTotal"></div><div class="k-value" id="kTotal">—</div><div class="k-sub" data-i18n="kTotalSub"></div></div><div class="card kpi"><div class="k-label" data-i18n="kUnique"></div><div class="k-value" id="kUnique">—</div><div class="k-sub" data-i18n="kUniqueSub"></div></div><div class="card kpi"><div class="k-label" data-i18n="kRegions"></div><div class="k-value" id="kRegions">—</div><div class="k-sub" data-i18n="kRegionsSub"></div></div><div class="card kpi"><div class="k-label" data-i18n="kProvinces"></div><div class="k-value" id="kProvinces">—</div><div class="k-sub" data-i18n="kProvincesSub"></div></div><div class="card kpi"><div class="k-label" data-i18n="kActive"></div><div class="k-value" id="kActive">—</div><div class="k-sub" data-i18n="kActiveSub"></div></div><div class="card kpi"><div class="k-label" data-i18n="kExpiring"></div><div class="k-value" id="kExpiring">—</div><div class="k-sub" data-i18n="kExpiringSub"></div></div></div><div class="chart-grid"><div class="card"><div class="section-title"><h2 data-i18n="chartRegionTitle"></h2><span class="sub" data-i18n="chartRegionSub"></span></div><div class="chart-box"><canvas id="regionChart"></canvas></div></div><div class="card"><div class="section-title"><h2 data-i18n="chartStatusTitle"></h2><span class="sub" data-i18n="chartStatusSub"></span></div><div class="chart-box"><canvas id="statusChart"></canvas></div></div></div><div class="chart-grid"><div class="card"><div class="section-title"><h2 data-i18n="chartProvinceTitle"></h2><span class="sub" data-i18n="chartProvinceSub"></span></div><div class="chart-box"><canvas id="provinceChart"></canvas></div></div><div class="card"><div class="section-title"><h2 data-i18n="chartTypeTitle"></h2><span class="sub" data-i18n="chartTypeSub"></span></div><div class="chart-box"><canvas id="typeChart"></canvas></div></div></div></section>
<section id="region" class="page"><div class="section-title"><h2 data-i18n="regionMatrixTitle"></h2><span class="sub" data-i18n="regionMatrixSub"></span></div><div class="region-layout"><div class="side-list" id="regionCards"></div><div class="card"><div class="section-title"><h2 id="regionTitle"></h2><span class="sub" id="regionMeta">—</span></div><div class="table-wrap"><table id="provinceSummaryTable"></table></div></div></div></section>

<script>
let RAW = [];
let BASE_SUMMARY = {total:0,uniquePartners:0,regions:0,provinces:0,campusFilled:0,signedFilled:0,endFilled:0,programModelFilled:0,directionFilled:0,counterpartyFilled:0,activeKnown:0,expired:0,minYear:null,maxYear:null,statusCounts:{},programModelCounts:{},counterpartyCounts:{},regionCounts:{},provinceCounts:{}};
const EXCEL_PATHS = [
  'China_MOU_Master.xlsx'
];
const EXCEL_SHEET_NAME = 'China_MOU_Master';
function normalizeCellValue(v){return String(v??'').trim()}
function pick(row, names){for(const name of names){if(Object.prototype.hasOwnProperty.call(row,name)){return normalizeCellValue(row[name])}}return ''}
function parseSignedYear(v){const m=String(v??'').match(/(19|20)\d{2}/);return m?Number(m[0]):null}
function parseCounterpartyGroup(v){const s=normalizeCellValue(v);if(!s)return '';return s.split('/')[0].split('；')[0].split(';')[0].trim()}
function excelRowToRecord(row, index){
  const signedRaw=pick(row,['Signed Year','签署年','签署日','Signed Date']);
  const status=pick(row,['Status','状态']) || '未填写';
  const counterpartyType=pick(row,['Counterparty Type','合作对象类型']);
  return {
    no: pick(row,['No.','No','NO','序号']) || String(index+1),
    chineseName: pick(row,['Chinese Name','中文名称','ChineseName']),
    koreanName: pick(row,['Korea Name','Korean Name','韩文名称','KoreaName']),
    province: pick(row,['Province / Area','Province/Area','Province','省份/地区','省份']),
    region: pick(row,['China Region','Region','中国区域','区域']),
    campus: pick(row,['Campus','校区']),
    programModel: pick(row,['Program Model','项目模式']) || 'Other',
    direction: pick(row,['Direction','方向']) || 'Reciprocal',
    signedRaw,
    signedYear: parseSignedYear(signedRaw),
    endRaw: pick(row,['End Year','End Date','有效期至','结束年']),
    status,
    inferredStatus: status,
    counterpartyType,
    counterpartyGroup: parseCounterpartyGroup(counterpartyType),
    notes: pick(row,['Notes','备注','备注栏位']),
    documentUrl: pick(row,['Document URL','DocumentURL','协议链接','文件链接','PDF链接','链接URL'])
  }
}
function summarizeRows(rows){
  const uniqueValues=(arr)=>[...new Set(arr.filter(v=>v!==undefined&&v!==null&&String(v).trim()!==''))];
  const countMap=(arr)=>arr.reduce((m,v)=>{const key=String(v||'未填写');m[key]=(m[key]||0)+1;return m},{});
  const years=rows.map(r=>r.signedYear).filter(y=>Number.isFinite(y));
  return {
    total: rows.length,
    uniquePartners: uniqueValues(rows.map(r=>r.chineseName)).length,
    regions: uniqueValues(rows.map(r=>r.region)).length,
    provinces: uniqueValues(rows.map(r=>r.province)).length,
    campusFilled: rows.filter(r=>r.campus).length,
    signedFilled: rows.filter(r=>r.signedRaw).length,
    endFilled: rows.filter(r=>r.endRaw).length,
    programModelFilled: rows.filter(r=>r.programModel).length,
    directionFilled: rows.filter(r=>r.direction).length,
    counterpartyFilled: rows.filter(r=>r.counterpartyType).length,
    activeKnown: rows.filter(r=>r.status==='Ongoing').length,
    expired: rows.filter(r=>r.status==='Expired').length,
    minYear: years.length?Math.min(...years):null,
    maxYear: years.length?Math.max(...years):null,
    statusCounts: countMap(rows.map(r=>r.status)),
    programModelCounts: countMap(rows.map(r=>r.programModel)),
    counterpartyCounts: countMap(rows.map(r=>r.counterpartyType)),
    regionCounts: countMap(rows.map(r=>r.region)),
    provinceCounts: countMap(rows.map(r=>r.province))
  }
}
async function fetchExcelArrayBuffer(){
  const errors=[];
  for(const path of EXCEL_PATHS){
    try{
      const url=path+(path.includes('?')?'&':'?')+'v='+Date.now();
      const res=await fetch(url,{cache:'no-store'});
      if(!res.ok){throw new Error(path+' HTTP '+res.status)}
      return {buffer:await res.arrayBuffer(),path,lastModified:res.headers.get('Last-Modified')};
    }catch(err){errors.push(err.message)}
  }
  throw new Error(errors.join(' / '));
}
async function loadExcelData(){
  if(typeof XLSX==='undefined') throw new Error('SheetJS XLSX library failed to load.');
  const {buffer,path,lastModified}=await fetchExcelArrayBuffer();
  const workbook=XLSX.read(buffer,{type:'array',cellDates:true});
  const sourceDate=lastModified?new Date(lastModified):((workbook.Props&&workbook.Props.Modified)?new Date(workbook.Props.Modified):new Date());
  setDataDate(sourceDate);
  const sheetName=workbook.SheetNames.includes(EXCEL_SHEET_NAME)?EXCEL_SHEET_NAME:(workbook.SheetNames[1]||workbook.SheetNames[0]);
  const worksheet=workbook.Sheets[sheetName];
  const rows=XLSX.utils.sheet_to_json(worksheet,{defval:'',raw:false});
  RAW=rows.map(excelRowToRecord).filter(r=>r.chineseName||r.koreanName);
  applyLocalPdfOverrides(RAW);
  BASE_SUMMARY=summarizeRows(RAW);
  updateDynamicSubtitle();
  console.info('China MOU Dashboard loaded Excel:', path, sheetName, RAW.length);
}

  console.error(err);
}

function setDataDate(d){
  if(!(d instanceof Date)||Number.isNaN(d.getTime()))return;
  const zhParts=new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Seoul',year:'numeric',month:'numeric',day:'numeric'}).formatToParts(d).reduce((a,p)=>(a[p.type]=p.value,a),{});
  DATA_DATE_ZH=`${zhParts.year} 年 ${Number(zhParts.month)} 月 ${Number(zhParts.day)} 日`;
  const koParts=new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',year:'numeric',month:'numeric',day:'numeric'}).formatToParts(d).reduce((a,p)=>(a[p.type]=p.value,a),{});
  DATA_DATE_KO=`${koParts.year}년 ${Number(koParts.month)}월 ${Number(koParts.day)}일`;
  const enParts=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Seoul',year:'numeric',month:'long',day:'numeric'}).formatToParts(d).reduce((a,p)=>(a[p.type]=p.value,a),{});

}

function drawTimeline(rows){const years=uniq(rows.map(r=>r.signedYear)).sort((a,b)=>a-b),counts=years.map(y=>rows.filter(r=>r.signedYear===y).length);renderChart('timelineChart','line',years,counts,{legend:false,label:t('signedRecord'),borderColor:'#0f766e',colors:['rgba(15,118,110,.18)'],fill:true});const recent=rows.filter(r=>r.signedYear).sort((a,b)=>(b.signedYear||0)-(a.signedYear||0)).map(r=>`<tr><td>${safe(r.signedRaw)}</td><td>${safe(displayName(r))}</td><td>${safe(val(r.province))}</td><td>${safe(r.programModel)}</td><td><span class="${statusClass(r.status)}">${safe(val(r.status))}</span></td></tr>`);makeTable('recentTable',t('thRecent'),recent);const exp=rows.filter(r=>r.status==='Expired').sort((a,b)=>(b.signedYear||0)-(a.signedYear||0)).slice(0,220).map(r=>`<tr><td><span class="${statusClass(r.status)}">${safe(val(r.status))}</span></td><td>${safe(r.endRaw)}</td><td>${safe(displayName(r))}</td><td>${safe(val(r.province))}</td><td>${safe(r.programModel)}</td></tr>`);makeTable('expiryTable',t('thExpiry'),exp,t('noExpiry'))}
/* ── PDF helpers ─────────────────────────────────────────── */
function resolvePdfUrl(raw){
  if(!raw||!String(raw).trim())return'';
  let u=String(raw).trim();
  // Google Drive: 任何格式的分享/查看鏈接 → 轉為 /preview（可 iframe 嵌入）
  const gdMatch=u.match(/drive\.google\.com\/file\/d\/([A-Za-z0-9_\-]+)/);
  if(gdMatch)return`https://drive.google.com/file/d/${gdMatch[1]}/preview`;
  // 其他完整 URL 直接使用
  if(/^https?:\/\//i.test(u))return u;
  // 相對路徑 → 補全當前頁面 base
  const base=window.location.href.split('?')[0].replace(/\/[^/]*$/,'/');
  return base+u;
}
function openPdf(rawUrl,title){
  const url=resolvePdfUrl(rawUrl);
  if(!url)return;
  document.getElementById('pdfTitle').textContent=title||'—';
  const openLabel=LANG==='ko'?'새 탭에서 열기':LANG==='en'?'Open in new tab':'新页面打开';
  document.getElementById('pdfOpenLabel').textContent=openLabel;
  document.getElementById('pdfOpenLink').href=url;
  document.getElementById('pdfFallbackLink').href=url;
  const fallbackMsg=LANG==='ko'?'브라우저가 PDF를 내장하여 표시할 수 없습니다.':LANG==='en'?'Your browser cannot display this PDF inline.':'浏览器无法内嵌显示此 PDF。';
  document.getElementById('pdfFallbackMsg').textContent=fallbackMsg;
  const frame=document.getElementById('pdfFrame');
  const fallback=document.getElementById('pdfFallback');
  frame.style.display='block';fallback.style.display='none';
  frame.src=url;
  frame.onerror=()=>{frame.style.display='none';fallback.style.display='flex'};
  document.getElementById('pdfOverlay').classList.add('open');
  document.body.style.overflow='hidden';
}
function closePdf(){
  document.getElementById('pdfOverlay').classList.remove('open');
  document.getElementById('pdfFrame').src='';
  document.body.style.overflow='';
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closePdf();closeUploadModal()}});

const GOOGLE_CLIENT_ID = '243189851204-0jpjas6krecpebdmujv3mhcrp210ndkf.apps.googleusercontent.com';

const GOOGLE_API_KEY = 'AIzaSyADMsw_-8r5S1D8U3bYwnwmOArlsUhN9BQ';
const DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.file';
const DRIVE_FOLDER_NAME = 'China_MOU_Documents';
const LS_OVERRIDES_KEY = 'mouPdfOverrides_v1';
const LS_FOLDER_KEY = 'mouDriveFolderId_v1';
let driveAccessToken = null, driveTokenExpiry = 0, driveTokenClient = null, uploadCtx = null;

function rowOverrideKey(r){
  return [r.chineseName||'',r.koreanName||'',r.signedRaw||'',r.endRaw||''].join('||');
}
function loadOverrides(){
  try{return JSON.parse(localStorage.getItem(LS_OVERRIDES_KEY)||'{}')}catch(e){return {}}
}
function saveOverride(key,url){
  const m=loadOverrides();m[key]=url;localStorage.setItem(LS_OVERRIDES_KEY,JSON.stringify(m));
}
function clearOverride(key){
  const m=loadOverrides();delete m[key];localStorage.setItem(LS_OVERRIDES_KEY,JSON.stringify(m));
}
function applyLocalPdfOverrides(rows){
  const m=loadOverrides();
  rows.forEach(r=>{
    const k=rowOverrideKey(r), url=m[k];
    if(url){r.documentUrl=url;r.localPdf=true}else{r.localPdf=false}
  });
}
function driveConfigured(){return GOOGLE_CLIENT_ID && !GOOGLE_CLIENT_ID.startsWith('PASTE_')}
function updateDriveStatusUI(){
  const dot=document.getElementById('driveStatusDot'), label=document.getElementById('driveStatusLabel'), btn=document.getElementById('driveStatusBtn');
  if(!dot||!label||!btn)return;
  const connected=driveAccessToken && Date.now()<driveTokenExpiry;
  btn.classList.toggle('connected',!!connected);
  const zh=LANG==='zh', ko=LANG==='ko';
  if(!driveConfigured()){label.textContent=zh?'Drive 上传未设定':ko?'Drive 업로드 미설정':'Drive upload not configured'}
  else if(connected){label.textContent=zh?'Google Drive 已连接':ko?'Google Drive 연결됨':'Google Drive Connected'}
  else{label.textContent=zh?'连接 Google Drive':ko?'Google Drive 연결':'Connect Google Drive'}
}
function handleDriveStatusClick(){
  if(!driveConfigured()){
    alert(LANG==='zh'?'尚未设定 Google Client ID，请先在 index.html 里的 GOOGLE_CLIENT_ID 填入你的 OAuth Client ID（步骤请见程式码注解）。':LANG==='ko'?'Google Client ID가 아직 설정되지 않았습니다. index.html의 GOOGLE_CLIENT_ID를 채워주세요.':'Google Client ID is not set yet. Please fill GOOGLE_CLIENT_ID in index.html (see comment for steps).');
    return;
  }
  ensureDriveToken().then(()=>updateDriveStatusUI());
}
function ensureDriveToken(){
  return new Promise((resolve,reject)=>{
    if(driveAccessToken && Date.now()<driveTokenExpiry){resolve(driveAccessToken);return}
    if(!driveConfigured()){reject(new Error('Google Client ID not configured'));return}
    if(typeof google==='undefined'||!google.accounts||!google.accounts.oauth2){reject(new Error('Google Identity Services 尚未载入，请检查网络或稍后再试'));return}
    if(!driveTokenClient){
      driveTokenClient=google.accounts.oauth2.initTokenClient({
        client_id:GOOGLE_CLIENT_ID,
        scope:DRIVE_SCOPE,
        callback:(resp)=>{
          if(resp && resp.access_token){
            driveAccessToken=resp.access_token;
            driveTokenExpiry=Date.now()+((resp.expires_in||3300)*1000)-60000;
            updateDriveStatusUI();
            resolve(driveAccessToken);
          }else{reject(new Error('Google 授权失败'))}
        }
      });
    }
    driveTokenClient.requestAccessToken({prompt:driveAccessToken?'':'consent'});
  });
}
async function driveFindOrCreateFolder(token){
  const cached=localStorage.getItem(LS_FOLDER_KEY);
  if(cached)return cached;
  const q=encodeURIComponent(`name='${DRIVE_FOLDER_NAME}' and mimeType='application/vnd.google-apps.folder' and trashed=false and 'root' in parents`);
  const searchRes=await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)`,{headers:{Authorization:`Bearer ${token}`}});
  const searchJson=await searchRes.json();
  if(searchJson.files && searchJson.files.length){localStorage.setItem(LS_FOLDER_KEY,searchJson.files[0].id);return searchJson.files[0].id}
  const createRes=await fetch('https://www.googleapis.com/drive/v3/files',{
    method:'POST',
    headers:{Authorization:`Bearer ${token}`,'Content-Type':'application/json'},
    body:JSON.stringify({name:DRIVE_FOLDER_NAME,mimeType:'application/vnd.google-apps.folder'})
  });
  const createJson=await createRes.json();
  if(!createJson.id)throw new Error('无法建立 Drive 资料夹：'+(createJson.error?.message||'未知错误'));
  localStorage.setItem(LS_FOLDER_KEY,createJson.id);
  return createJson.id;
}
async function driveUploadFile(token,file,folderId,displayName){
  const metadata={name:displayName,parents:[folderId],mimeType:'application/pdf'};
  const boundary='mouUpload'+Date.now();
  const fileBuf=await file.arrayBuffer();
  const metaPart=`--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n--${boundary}\r\nContent-Type: application/pdf\r\n\r\n`;
  const closeDelim=`\r\n--${boundary}--`;
  const body=new Blob([metaPart,fileBuf,closeDelim]);
  const res=await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id',{
    method:'POST',
    headers:{Authorization:`Bearer ${token}`,'Content-Type':`multipart/related; boundary=${boundary}`},
    body
  });
  const json=await res.json();
  if(!json.id)throw new Error('上传失败：'+(json.error?.message||'未知错误'));
  return json.id;
}
async function driveSetPublic(token,fileId){
  await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}/permissions`,{
    method:'POST',
    headers:{Authorization:`Bearer ${token}`,'Content-Type':'application/json'},
    body:JSON.stringify({role:'reader',type:'anyone'})
  });
}

    gapi.load('picker',{callback:resolve,onerror:()=>reject(new Error('Google Picker 载入失败'))});

function pickerCallback(data){
  if(data.action!==google.picker.Action.PICKED)return;
  const r=uploadCtx;
  if(!r)return;
  const doc=data.docs[0];
  const url=doc.url||`https://drive.google.com/file/d/${doc.id}/view?usp=drivesdk`;
  saveOverride(rowOverrideKey(r),url);
  applyLocalPdfOverrides(RAW);
  updateAll();
  const statusEl=document.getElementById('uploadStatus');
  if(statusEl){
    statusEl.textContent=LANG==='zh'?'已连结！记得确认这个档案在 Drive 里的分享权限是「知道连结的人可查看」，其他人才看得到。':LANG==='ko'?'연결 완료! Drive 공유 권한을 확인하세요.':'Linked! Make sure the file sharing permission on Drive allows others to view it.';

  }

async function submitUpload(){
  const r=uploadCtx;
  if(!r)return;
  const fileInput=document.getElementById('uploadFileInput');
  const file=fileInput.files && fileInput.files[0];
  const statusEl=document.getElementById('uploadStatus');
  const submitBtn=document.getElementById('uploadSubmitBtn');
  if(!driveConfigured()){
    statusEl.textContent=LANG==='zh'?'尚未设定 Google Client ID。':'Google Client ID not configured.';
    statusEl.className='error';
    return;
  }
  if(!file){
    statusEl.textContent=LANG==='zh'?'请先选择一个 PDF 档案。':LANG==='ko'?'PDF 파일을 선택하세요.':'Please choose a PDF file first.';
    statusEl.className='error';
    return;
  }
  if(file.type!=='application/pdf'){
    statusEl.textContent=LANG==='zh'?'只能上传 PDF 档案。':LANG==='ko'?'PDF 파일만 업로드할 수 있습니다.':'Only PDF files are supported.';
    statusEl.className='error';
    return;
  }
  submitBtn.disabled=true;
  try{
    statusEl.className='';
    statusEl.textContent=LANG==='zh'?'正在连接 Google 帐号…':LANG==='ko'?'Google 계정에 연결 중…':'Connecting to Google account…';
    const token=await ensureDriveToken();
    updateDriveStatusUI();
    statusEl.textContent=LANG==='zh'?'正在建立/寻找资料夹…':LANG==='ko'?'폴더 확인 중…':'Preparing folder…';
    const folderId=await driveFindOrCreateFolder(token);
    statusEl.textContent=LANG==='zh'?'正在上传 PDF…':LANG==='ko'?'PDF 업로드 중…':'Uploading PDF…';
    const displayName=`${r.chineseName||r.koreanName||'MOU'}_${r.signedRaw||''}.pdf`.replace(/[\\/:*?"<>|]/g,'_');
    const fileId=await driveUploadFile(token,file,folderId,displayName);
    if(document.getElementById('uploadPublicChk').checked){
      statusEl.textContent=LANG==='zh'?'正在设定分享权限…':LANG==='ko'?'공유 권한 설정 중…':'Setting sharing permission…';
      await driveSetPublic(token,fileId);
    }
    const url=`https://drive.google.com/file/d/${fileId}/view?usp=drivesdk`;
    saveOverride(rowOverrideKey(r),url);

  }finally{
    submitBtn.disabled=false;
  }
}

function drawDetails(rows){
  dataMeta.textContent=interpolate(t('dataMeta'),{n:fmt(rows.length),total:fmt(RAW.length)});
  const withPdf=rows.filter(r=>r.documentUrl).length;
  const pct=rows.length?Math.round(withPdf/rows.length*100):0;
  const coverLabel=LANG==='ko'?`PDF 연결 ${withPdf}건 / ${rows.length}건 (${pct}%)`:LANG==='en'?`PDF linked: ${withPdf} / ${rows.length} (${pct}%)`:`已关联 PDF：${withPdf} / ${rows.length} 条（${pct}%）`;
  const coverageHtml=`<div class="pdf-coverage-bar"><span>${coverLabel}</span><div class="pdf-coverage-track"><div class="pdf-coverage-fill" style="width:${pct}%"></div></div></div>`;
  const metaEl=document.getElementById('dataMeta');
  let coverEl=document.getElementById('pdfCoverageBar');
  if(!coverEl){coverEl=document.createElement('div');coverEl.id='pdfCoverageBar';metaEl.parentNode.insertBefore(coverEl,metaEl.nextSibling)}
  coverEl.innerHTML=coverageHtml;
  window.__detailRows=rows;
  const shown=rows.map((r,idx)=>{
    const pdfBtn=r.documentUrl
      ?`<button class="pdf-btn" data-url="${safe(r.documentUrl)}" data-title="${safe(displayName(r))}" onclick="openPdf(this.dataset.url,this.dataset.title)">📄 ${LANG==='ko'?'보기':LANG==='en'?'View':'查看'}</button>`
      :`<span class="pdf-none">—</span>`;
    const uploadIconBtn=`<button class="upload-icon-btn" title="${LANG==='zh'?'上传/更换 PDF':LANG==='ko'?'PDF 업로드/교체':'Upload/replace PDF'}" onclick="openUploadModal(window.__detailRows[${idx}])">📎</button>`;
    const localTag=r.localPdf
      ?`<span class="local-tag">${LANG==='zh'?'本机上传':LANG==='ko'?'로컬 업로드':'Local upload'}</span><button class="local-clear" onclick="removeLocalPdf(window.__detailRows[${idx}])">${LANG==='zh'?'清除':LANG==='ko'?'지우기':'Clear'}</button>`
      :'';
    const pdfCell=`<div class="upload-cell">${pdfBtn}${uploadIconBtn}${localTag}</div>`;
    return`<tr><td>${safe(r.no)}</td><td><strong>${safe(displayName(r))}</strong><br><span style="color:#7b7468">${safe(subName(r))}</span></td><td><span class="pill region">${safe(val(r.region))}</span><br>${safe(val(r.province))}</td><td>${safe(r.campus)}</td><td><span class="pill type">${safe(r.programModel)}</span></td><td>${safe(val(r.counterpartyType))}</td><td>${safe(r.signedRaw)}<br><span style="color:#7b7468">${safe(r.endRaw)}</span></td><td><span class="${statusClass(r.status)}">${safe(val(r.status))}</span></td><td>${safe(r.notes)}</td><td style="white-space:nowrap">${pdfCell}</td></tr>`;
  });
  makeTable('detailTable',t('thDetail'),shown);
}
function distributionCard(title,key,rows,limit=12){
  const items=countBy(rows,key);
  const shown=items.slice(0,limit);
  const rest=items.slice(limit).reduce((sum,item)=>sum+item[1],0);
  const body=shown.map(([name,n])=>`<div class="dist-row"><span title="${safe(val(name))}">${safe(val(name))}</span><strong>${fmt(n)}</strong></div>`).join('')+(rest?`<div class="dist-row"><span>${tr('其他项目','기타 항목','Other items')}</span><strong>${fmt(rest)}</strong></div>`:'');
  return `<div class="comp-item dist-card"><div class="comp-head"><span>${safe(title)}</span><span>${fmt(rows.length)}</span></div><div class="dist-list">${body||`<div class="footer-note">${t('noData')}</div>`}</div></div>`
}
function colorClassByIndex(i){return ['green','blue','orange','red','purple','gray'][i%6]}
function renderStackedChart(id,labels,datasets){
  const ctx=document.getElementById(id);if(!ctx)return;if(charts[id])charts[id].destroy();
  charts[id]=new Chart(ctx,{type:'bar',data:{labels:labels.map(x=>val(x)),datasets:datasets.map((ds,i)=>({label:val(ds.label),data:ds.data,backgroundColor:COLORS[i%COLORS.length],borderWidth:0,borderRadius:4,barThickness:26}))},options:{responsive:true,maintainAspectRatio:false,indexAxis:'y',plugins:{legend:{display:true,position:'bottom',labels:{boxWidth:10,usePointStyle:true}},tooltip:{callbacks:{label:ctx=>`${ctx.dataset.label}: ${fmt(ctx.raw)}`}}},scales:{x:{stacked:true,ticks:{color:'#7b7468'},grid:{color:'rgba(223,216,206,.55)'}},y:{stacked:true,ticks:{color:'#7b7468'},grid:{display:false}}}}})
}
function topCategoryKeys(rows,key,limit=6){
  const items=countBy(rows,key).filter(([name])=>String(name||'').trim()!=='');
  return items.slice(0,limit).map(([name])=>name);
}
function summaryGroup(title,key,rows,limit=8){
  const items=countBy(rows,key).slice(0,limit);
  const body=items.map(([name,n],i)=>`<span class="summary-chip ${colorClassByIndex(i)}"><span>${safe(val(name))}</span><strong>${fmt(n)}</strong></span>`).join('')||`<span class="summary-chip gray">${t('noData')}</span>`;
  return `<div class="summary-group"><h3>${safe(title)}</h3><div class="summary-chip-list">${body}</div></div>`
}
function drawQuality(rows=currentRows){
  const qualityKpiGrid=document.getElementById('qualityKpiGrid');
  const qualitySummaryTags=document.getElementById('qualitySummaryTags');
  const qualityStackedTitle=document.getElementById('qualityStackedTitle');
  const qualityStackedSub=document.getElementById('qualityStackedSub');
  const qualitySummaryTitle=document.getElementById('qualitySummaryTitle');
  const qualitySummarySub=document.getElementById('qualitySummarySub');
  const uniquePartners=uniq(rows.map(r=>r.chineseName)).length;
  const totalAgreements=rows.length;
  const ongoing=rows.filter(r=>r.status==='Ongoing').length;
  const expired=rows.filter(r=>r.status==='Expired').length;
  const missingStatus=rows.filter(r=>!r.status||r.status==='未填写').length;
  const missingProgramModel=rows.filter(r=>!r.programModel||r.programModel==='未填写').length;
  const kpis=LANG==='ko'?
    [['협력기관 수',uniquePartners,'중복 제외'],['협약 총수',totalAgreements,'전체 MOU 기록'],['Ongoing',ongoing,'유효/진행 중'],['Expired',expired,'만료'],['Status 미기재',missingStatus,'상태 확인 필요'],['Program Model 미기재',missingProgramModel,'모델 확인 필요']]:
    LANG==='en'?
    [['Partners',uniquePartners,'Deduplicated'],['Total Agreements',totalAgreements,'All MOU records'],['Ongoing',ongoing,'Active / in progress'],['Expired',expired,'Expired'],['Status not specified',missingStatus,'Needs status confirmation'],['Program Model not specified',missingProgramModel,'Needs model confirmation']]:
    [['合作方数',uniquePartners,'按中文名称去重'],['协议总数',totalAgreements,'全部 MOU 记录'],['Ongoing',ongoing,'有效 / 进行中'],['Expired',expired,'已到期'],['Status 未填写',missingStatus,'需要确认状态'],['Program Model 未填写',missingProgramModel,'需要确认模式']];
  if(qualityKpiGrid){qualityKpiGrid.innerHTML=kpis.map(([label,num,sub])=>`<div class="quality-kpi-item"><div class="label">${safe(label)}</div><div class="num">${fmt(num)}</div><div class="sub">${safe(sub)}</div></div>`).join('')}
  if(qualityStackedTitle)qualityStackedTitle.textContent=tr('中国区域 × Program Model 分布','중국 권역별 Program Model 분포','China Region × Program Model Distribution');
  if(qualityStackedSub)qualityStackedSub.textContent=tr('看各区域的项目模式结构，而不是只看总数','각 권역에서 프로그램 모델이 어떻게 구성되어 있는지 확인합니다','View how program models are structured within each region, not just the totals');
  const regionLabels=countBy(rows,'region').map(([rg])=>rg);
  const pmKeys=topCategoryKeys(rows,'programModel',8);
  const datasets=pmKeys.map(k=>({label:k,data:regionLabels.map(rg=>rows.filter(r=>r.region===rg&&r.programModel===k).length)}));
  renderStackedChart('qualityStackedChart',regionLabels,datasets);
  if(qualitySummaryTitle)qualitySummaryTitle.textContent=tr('分类汇总','분류별 요약','Category Summary');
  if(qualitySummarySub)qualitySummarySub.textContent=tr('当前筛选范围内的真实分类数量','현재 필터 범위의 실제 분류 수량','Actual category counts within the current filter');
  if(qualitySummaryTags){qualitySummaryTags.innerHTML=[
    summaryGroup('Status','status',rows,8),
    summaryGroup('Program Model','programModel',rows,10),
    summaryGroup(tr('合作对象类型','협력기관 유형','Counterparty Type'),'counterpartyType',rows,8),
    summaryGroup('Direction','direction',rows,6),
    summaryGroup('Campus','campus',rows,6)
  ].join('')}
  const labels=LANG==='ko'?['협력기관 수(중복 제외)','협약 총수','Ongoing','Expired','Status 미기재']:LANG==='en'?['Partners (deduplicated)','Total Agreements','Ongoing','Expired','Status not specified']:['合作方数（去重）','协议总数','Ongoing 有效','Expired 到期','Status 未填写'];
  renderChart('completeChart','bar',labels,[uniquePartners,totalAgreements,ongoing,expired,missingStatus],{indexAxis:'y',legend:false,label:t('completionRate')});
  const nameMap=new Map();rows.forEach(r=>{if(!r.chineseName)return;if(!nameMap.has(r.chineseName))nameMap.set(r.chineseName,[]);nameMap.get(r.chineseName).push(r)});
  const dups=[...nameMap.entries()].filter(([name,arr])=>arr.length>1).sort((a,b)=>b[1].length-a[1].length).slice(0,80).map(([name,arr])=>`<tr><td><strong>${safe(LANG==='ko'?(arr[0].koreanName||name):name)}</strong></td><td>${fmt(arr.length)}</td><td>${safe(uniq(arr.map(r=>val(r.province))).join(' / '))}</td><td>${safe(uniq(arr.map(r=>r.programModel)).join(', '))}</td><td>${safe(uniq(arr.map(r=>r.signedRaw).filter(Boolean)).slice(0,12).join(', '))}</td></tr>`);
  makeTable('duplicateTable',t('thDup'),dups)
}
function updateAll(){currentRows=filteredRows();setKpis(currentRows);drawOverview(currentRows);drawRegion(currentRows);drawTimeline(currentRows);drawDetails(currentRows);drawQuality(currentRows)}
function downloadCSV(){const headers=LANG==='ko'?['No','중문명','한국어명','성/지역','중국 권역','Campus','Program Model','Direction','Signed Year','End Year','Status','Counterparty Type','Notes']:LANG==='en'?['No','Chinese Name','Korean Name','Province/Area','China Region','Campus','Program Model','Direction','Signed Year','End Year','Status','Counterparty Type','Notes']:['No','中文名称','韩文名称','省份/地区','中国区域','Campus','Program Model','Direction','Signed Year','End Year','Status','Counterparty Type','Notes'];const rows=currentRows.map(r=>[r.no,r.chineseName,r.koreanName,LANG==='zh'?r.province:val(r.province),LANG==='zh'?r.region:val(r.region),r.campus,r.programModel,LANG==='zh'?r.direction:val(r.direction),r.signedRaw,r.endRaw,LANG==='zh'?r.status:val(r.status),LANG==='zh'?r.counterpartyType:val(r.counterpartyType),r.notes]);const csv=[headers,...rows].map(row=>row.map(v=>`"${String(v??'').replaceAll('"','""')}"`).join(',')).join('\n');const blob=new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8;'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=LANG==='ko'?'china_mou_filtered_ko.csv':LANG==='en'?'china_mou_filtered_en.csv':'china_mou_filtered_zh.csv';a.click();URL.revokeObjectURL(url)}
document.querySelectorAll('.nav button').forEach(btn=>{btn.addEventListener('click',()=>{document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));btn.classList.add('active');document.getElementById(btn.dataset.page).classList.add('active');setTimeout(()=>Object.values(charts).forEach(c=>c.resize()),60)})});
async function bootstrapDashboard(){
  applyStaticText();
  updateDriveStatusUI();
  try{
    await loadExcelData();
    initFilters();
    updateAll();
  }catch(err){
    showLoadError(err);
  }
}
bootstrapDashboard();
</script>
